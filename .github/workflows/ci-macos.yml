name: CI (macOS)

on:
  push:
    branches:
      - master
      - 'macos-system-libs-and-fixes'
      - 'cmake-build'
      - 'ci-*'
  pull_request:
    branches:
      - master
      - 'macos-system-libs-and-fixes'
      - 'cmake-build'
  workflow_dispatch:

jobs:
  build:
    name: Build IM (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon only. macOS 13 (Intel) is being phased out by
        # GitHub's runner pool; add it back here if you specifically
        # need x86_64 verification.
        os: ['macos-14', 'macos-15']

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # cmake, pkg-config, ninja, lua@5.4 are typically preinstalled
          # but we 'brew install' them explicitly so the workflow doesn't
          # depend on the runner image's exact contents.
          brew install --quiet \
            cmake ninja pkg-config \
            libtiff jpeg-turbo libpng libexif liblzf lz4 \
            jasper fftw libomp lua@5.4

      - name: Configure
        run: |
          # IM source isn't compatible with Lua 5.5 yet (macros that
          # changed in 5.5 break compilation); pin Lua 5.4 explicitly.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLUA_INCLUDE_DIR=/opt/homebrew/opt/lua@5.4/include/lua5.4 \
            -DLUA_LIBRARY=/opt/homebrew/opt/lua@5.4/lib/liblua5.4.dylib

      - name: Build
        run: cmake --build build -j $(sysctl -n hw.ncpu)

      - name: Show build artefacts
        run: |
          set -e
          shopt -s nullglob
          for lib in build/lib/*.dylib; do
            echo "=== $lib ==="
            file "$lib"
            otool -L "$lib" | head -20 || true
          done

      - name: Smoke-test Lua bindings
        run: |
          cat > smoke.lua <<'EOF'
          package.cpath = "build/lib/?.dylib;" .. package.cpath
          local im = require "imlua"
          print("imlua loaded, version =", im.Version())
          local img = im.ImageCreate(16, 12, im.RGB, im.BYTE)
          assert(img:Width() == 16 and img:Height() == 12)
          img:Destroy()
          local imp = require "imlua_process"
          assert(type(imp.ProcessUnArithmeticOp) == "function")
          local jp2 = require "imlua_jp2"
          assert(jp2 ~= nil)
          local fft = require "imlua_fftw3"
          assert(fft ~= nil)
          print("ok")
          EOF
          /opt/homebrew/opt/lua@5.4/bin/lua smoke.lua

      - name: Upload IM libraries
        uses: actions/upload-artifact@v4
        with:
          name: im-libs-${{ matrix.os }}
          path: build/lib/
          retention-days: 14
          if-no-files-found: error

      - name: Upload IM headers
        uses: actions/upload-artifact@v4
        with:
          name: im-headers-${{ matrix.os }}
          path: include/
          retention-days: 14
          if-no-files-found: error

