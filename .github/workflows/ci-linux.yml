name: CI (Linux)

on:
  push:
    branches:
      - master
      - 'macos-system-libs-and-fixes'
      - 'ci-*'
  pull_request:
    branches:
      - master
      - 'macos-system-libs-and-fixes'
  workflow_dispatch:

jobs:
  build:
    name: Build IM (Ubuntu ${{ matrix.os }})
    runs-on: ubuntu-${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: ['22.04', '24.04']

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libtiff-dev \
            libjpeg-dev \
            libpng-dev \
            libexif-dev \
            liblzf-dev \
            liblz4-dev \
            libfftw3-dev \
            libomp-dev
          # libjasper-dev was dropped from Ubuntu after 18.04 due to
          # unfixed CVEs; im_jp2 cannot be built from system libs on
          # this image and is intentionally skipped below.

      - name: Build core IM libraries
        working-directory: src
        run: |
          # USE_SYSTEM_IMAGE_LIBS auto-enables for Linux in config.mak.
          # Build the libraries we have system deps for; im_jp2 is
          # skipped (no system libjasper).
          make im
          make im_process
          make im_process_omp
          make im_fftw3

      - name: Show build artefacts
        run: |
          set -e
          shopt -s nullglob
          for lib in lib/*/lib*.so lib/*/lib*.a; do
            echo "=== $lib ==="
            file "$lib"
            if [ "${lib##*.}" = "so" ]; then
              ldd "$lib" | head -20 || true
            fi
          done

      - name: Upload IM libraries
        uses: actions/upload-artifact@v4
        with:
          name: im-libs-ubuntu-${{ matrix.os }}
          path: lib/
          retention-days: 14
          if-no-files-found: error

      - name: Upload IM headers
        uses: actions/upload-artifact@v4
        with:
          name: im-headers-ubuntu-${{ matrix.os }}
          path: include/
          retention-days: 14
          if-no-files-found: error
