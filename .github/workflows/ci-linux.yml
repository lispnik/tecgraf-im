name: CI (Linux)

on:
  push:
    branches:
      - master
      - 'macos-system-libs-and-fixes'
      - 'cmake-build'
      - 'ci-*'
  pull_request:
    branches:
      - master
      - 'macos-system-libs-and-fixes'
      - 'cmake-build'
  workflow_dispatch:

jobs:
  build:
    name: Build IM (Ubuntu ${{ matrix.os }})
    runs-on: ubuntu-${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # HEIF is per-release: 22.04 ships libheif 1.12, which predates
        # heif_brand2_avif (added in 1.16) and does not compile. The add-on is
        # optional, so that job simply builds without it.
        include:
          - os: '22.04'
            heif: 'OFF'
          - os: '24.04'
            heif: 'ON'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libtiff-dev libjpeg-dev libpng-dev \
            libexif-dev liblzf-dev liblz4-dev \
            libfftw3-dev libomp-dev \
            liblua5.4-dev lua5.4 \
            libheif-dev
          # libjasper-dev was dropped from Ubuntu after 18.04 due to
          # unfixed CVEs; libim_jp2 can't be built from system libs here.

      - name: Install libheif codec plugins
        # Ubuntu 24.04 ships libheif's codecs as separate plugin packages, so
        # libheif-dev on its own yields a container with no encoder and no
        # decoder.
        #
        # Gated on the matrix rather than probed for each package with
        # apt-cache. A probe cannot tell "not packaged for this release" from
        # "renamed since this was written", and the quiet answer to both was a
        # skip -- which on a rename would give a libheif with no AV1 codec,
        # every AVIF case skipping itself as codec-unavailable, and a fully
        # green run with AVIF untested. Installing outright means a rename
        # fails the job, which is the outcome that gets noticed. The releases
        # that have no plugin packages are exactly the ones building without
        # HEIF, so nothing is lost.
        if: matrix.heif == 'ON'
        run: |
          sudo apt-get install -y --no-install-recommends \
            libheif-plugin-libde265 libheif-plugin-x265 \
            libheif-plugin-aomdec libheif-plugin-aomenc

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DIM_BUILD_CAPTURE=ON \
            -DIM_BUILD_JP2=OFF \
            -DIM_BUILD_HEIF=${{ matrix.heif }}

      - name: Build
        run: cmake --build build -j $(nproc)

      # Unit tests plus the Lua binding smoke test, which now lives in
      # test/smoke.lua and is registered with CTest by test/CMakeLists.txt.
      # imlua_jp2 is absent here (IM_BUILD_JP2=OFF); CMake passes only the
      # modules actually built, so no per-platform module list is needed.
      - name: Run test suite
        run: ctest --test-dir build --output-on-failure

      - name: Show build artefacts
        run: |
          set -e
          shopt -s nullglob
          for lib in build/lib/lib*.so; do
            echo "=== $lib ==="
            file "$lib"
            ldd "$lib" | head -20 || true
          done

      - name: Upload IM libraries
        uses: actions/upload-artifact@v4
        with:
          name: im-libs-ubuntu-${{ matrix.os }}
          path: build/lib/
          retention-days: 14
          if-no-files-found: error

      - name: Upload IM headers
        uses: actions/upload-artifact@v4
        with:
          name: im-headers-ubuntu-${{ matrix.os }}
          path: include/
          retention-days: 14
          if-no-files-found: error


  # Every other job builds Release or RelWithDebInfo, which define NDEBUG and
  # compile out every assert() in the library. That left the asserts as dead
  # code: an assert whose condition disagreed with the runtime guard beside it
  # would never be noticed, and a developer building Debug locally would meet
  # the difference with no warning. This job compiles them.
  #
  # The handful of cases that deliberately violate a documented precondition,
  # to prove the release guard behind it, are #ifdef NDEBUG in the test
  # sources -- they would trip the very assert they are testing around. They
  # are named in the comment on each.
  asserts:
    name: Asserts enabled (Ubuntu 24.04)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libtiff-dev libjpeg-dev libpng-dev \
            libexif-dev liblzf-dev liblz4-dev \
            libfftw3-dev libomp-dev \
            liblua5.4-dev lua5.4 \
            libheif-dev \
            libheif-plugin-libde265 libheif-plugin-x265 \
            libheif-plugin-aomdec libheif-plugin-aomenc

      - name: Configure
        # Debug rather than -UNDEBUG on top of Release: the point is the
        # configuration a developer actually gets from -DCMAKE_BUILD_TYPE=Debug.
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DIM_BUILD_CAPTURE=ON \
            -DIM_BUILD_JP2=OFF \
            -DIM_BUILD_HEIF=ON

      - name: Build
        run: cmake --build build -j $(nproc)

      - name: Run test suite
        run: ctest --test-dir build --output-on-failure
