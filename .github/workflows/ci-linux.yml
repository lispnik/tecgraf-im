name: CI (Linux)

on:
  push:
    branches:
      - master
      - 'macos-system-libs-and-fixes'
      - 'cmake-build'
      - 'ci-*'
  pull_request:
    branches:
      - master
      - 'macos-system-libs-and-fixes'
      - 'cmake-build'
  workflow_dispatch:

jobs:
  build:
    name: Build IM (Ubuntu ${{ matrix.os }})
    runs-on: ubuntu-${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # HEIF is per-release: 22.04 ships libheif 1.12, which predates
        # heif_brand2_avif and does not compile. The add-on is optional, so
        # that job simply builds without it.
        include:
          - os: '22.04'
            heif: 'OFF'
          - os: '24.04'
            heif: 'ON'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libtiff-dev libjpeg-dev libpng-dev \
            libexif-dev liblzf-dev liblz4-dev \
            libfftw3-dev libomp-dev \
            liblua5.4-dev lua5.4 \
            libheif-dev
          # libjasper-dev was dropped from Ubuntu after 18.04 due to
          # unfixed CVEs; libim_jp2 can't be built from system libs here.

      - name: Install libheif codec plugins
        # Ubuntu 24.04 ships libheif's codecs as separate plugin packages, so
        # libheif-dev on its own yields a container with no encoder and no
        # decoder -- every HEIF test then fails with IM_ERR_COMPRESS. The
        # packages do not exist on 22.04, hence the probe rather than a plain
        # install.
        run: |
          for pkg in libheif-plugin-libde265 libheif-plugin-x265 \
                     libheif-plugin-aomdec libheif-plugin-aomenc; do
            if apt-cache show "$pkg" >/dev/null 2>&1; then
              sudo apt-get install -y --no-install-recommends "$pkg"
            else
              echo "skipping $pkg: not packaged for this release"
            fi
          done

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DIM_BUILD_JP2=OFF \
            -DIM_BUILD_HEIF=${{ matrix.heif }}

      - name: Build
        run: cmake --build build -j $(nproc)

      # Unit tests plus the Lua binding smoke test, which now lives in
      # test/smoke.lua and is registered with CTest by test/CMakeLists.txt.
      # imlua_jp2 is absent here (IM_BUILD_JP2=OFF); CMake passes only the
      # modules actually built, so no per-platform module list is needed.
      - name: Run test suite
        run: ctest --test-dir build --output-on-failure

      - name: Show build artefacts
        run: |
          set -e
          shopt -s nullglob
          for lib in build/lib/lib*.so; do
            echo "=== $lib ==="
            file "$lib"
            ldd "$lib" | head -20 || true
          done

      - name: Upload IM libraries
        uses: actions/upload-artifact@v4
        with:
          name: im-libs-ubuntu-${{ matrix.os }}
          path: build/lib/
          retention-days: 14
          if-no-files-found: error

      - name: Upload IM headers
        uses: actions/upload-artifact@v4
        with:
          name: im-headers-ubuntu-${{ matrix.os }}
          path: include/
          retention-days: 14
          if-no-files-found: error

