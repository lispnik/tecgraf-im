name: CI (Windows)

on:
  push:
    branches:
      - master
      - 'macos-system-libs-and-fixes'
      - 'cmake-build'
      - 'ci-*'
  pull_request:
    branches:
      - master
      - 'macos-system-libs-and-fixes'
      - 'cmake-build'
  workflow_dispatch:

env:
  # vcpkg ports the IM build links against. liblzf is intentionally
  # absent — no vcpkg port exists, so the CMakeLists falls back to
  # the bundled src/liblzf/ tree.
  VCPKG_DEPS: tiff libjpeg-turbo libpng libexif lz4 jasper fftw3 lua

jobs:
  build:
    name: Build IM (windows-2022)
    runs-on: windows-2022

    env:
      # Tell vcpkg to put per-port build artefacts in a fixed location
      # so we can round-trip them through actions/cache. Without this
      # vcpkg falls back to %LOCALAPPDATA%/vcpkg/archives which is
      # hardware-specific and not always cacheable.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Activate MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install pkg-config and a Lua interpreter
        shell: pwsh
        run: |
          # pkgconfiglite for CMakeLists' pkg_check_modules calls.
          # Lua via chocolatey because vcpkg's lua port ships the lib
          # but no lua.exe binary in tools/.
          choco install pkgconfiglite lua -y --no-progress

      - name: Set up vcpkg binary cache directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" | Out-Null

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          # vcpkg's binary cache stores per-port .zip archives keyed
          # by ABI hash. Restoring this skips the "compile from source"
          # phase on subsequent runs — first-run is ~15 min, cached
          # runs are ~30 s.
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-binary-cache-windows-2022-${{ env.VCPKG_DEPS }}-v1
          restore-keys: |
            vcpkg-binary-cache-windows-2022-

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          & $vcpkg install --triplet x64-windows ${{ env.VCPKG_DEPS }}

      - name: Configure
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts/buildsystems/vcpkg.cmake"
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build -j

      - name: Show build artefacts
        shell: pwsh
        run: |
          Get-ChildItem build/lib | Format-Table Name, Length

      - name: Smoke-test Lua bindings
        shell: pwsh
        run: |
          # The vcpkg lua port is built against vcpkg's lua DLL, but
          # the chocolatey lua package ships a self-contained
          # interpreter that's good enough for a smoke test.
          $env:PATH = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin;$PWD/build/lib;" + $env:PATH
          @"
          package.cpath = "build/lib/?.dll;" .. package.cpath
          local im = require "imlua"
          print("imlua loaded, version =", im.Version())
          local img = im.ImageCreate(16, 12, im.RGB, im.BYTE)
          assert(img:Width() == 16 and img:Height() == 12)
          img:Destroy()
          local imp = require "imlua_process"
          assert(type(imp.ProcessUnArithmeticOp) == "function")
          print("ok")
          "@ | Out-File -Encoding ascii smoke.lua
          lua smoke.lua

      - name: Upload IM libraries
        uses: actions/upload-artifact@v4
        with:
          name: im-libs-windows-2022
          path: build/lib/
          retention-days: 14
          if-no-files-found: error

      - name: Upload IM headers
        uses: actions/upload-artifact@v4
        with:
          name: im-headers-windows-2022
          path: include/
          retention-days: 14
          if-no-files-found: error
