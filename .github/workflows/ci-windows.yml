name: CI (Windows)

on:
  push:
    branches:
      - master
      - 'macos-system-libs-and-fixes'
      - 'cmake-build'
      - 'ci-*'
  pull_request:
    branches:
      - master
      - 'macos-system-libs-and-fixes'
      - 'cmake-build'
  workflow_dispatch:

env:
  # vcpkg ports the IM build links against. liblzf is intentionally
  # absent — no vcpkg port exists, so the CMakeLists falls back to
  # the bundled src/liblzf/ tree.
  #
  # libheif's codecs are opt-in features: the default pulls in [core,hevc]
  # (libde265 + x265) but no AV1, so AVIF had no encoder or decoder and every
  # test that touches it failed. 'aom' supplies both.
  # pkgconf is the pkg-config implementation the CMakeLists' seven
  # pkg_check_modules calls go through. It used to come from Chocolatey, which
  # meant an unverified plain-HTTP download from SourceForge on every run --
  # the package ships no checksum, and Chocolatey eventually stopped
  # permitting that by default and broke the job outright. Taking it from
  # vcpkg, which this job already runs for everything else, removes the
  # second package manager and the unverified download with it.
  VCPKG_DEPS: tiff libjpeg-turbo libpng libexif lz4 jasper fftw3 lua pkgconf "libheif[core,hevc,aom]"

jobs:
  build:
    name: Build IM (windows-2022)
    runs-on: windows-2022

    env:
      # Tell vcpkg to put per-port build artefacts in a fixed location
      # so we can round-trip them through actions/cache. Without this
      # vcpkg falls back to %LOCALAPPDATA%/vcpkg/archives which is
      # hardware-specific and not always cacheable.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Activate MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up vcpkg binary cache directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" | Out-Null

      - name: Derive the vcpkg cache key
        id: vcpkg-key
        shell: pwsh
        # Hash VCPKG_DEPS so the key tracks the dependency list on its own.
        # A hand-maintained tag was a one-way trap: actions/cache only writes
        # an entry when the primary key misses, so once a stale key was
        # stored, forgetting to bump it meant every later run rebuilt the
        # changed port from source (~15 min) and never saved the result.
        # Hashed rather than embedded because cache keys may not contain
        # commas and the libheif feature list has them. Read through
        # $env: rather than ${{ }} so the quotes in the value cannot break
        # out of the script.
        run: |
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($env:VCPKG_DEPS)
          $sha = [System.Security.Cryptography.SHA256]::Create().ComputeHash($bytes)
          $hex = ([System.BitConverter]::ToString($sha) -replace '-','').Substring(0,16).ToLower()
          "hash=$hex" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache@v4
        with:
          # vcpkg's binary cache stores per-port .zip archives keyed
          # by ABI hash. Restoring this skips the "compile from source"
          # phase on subsequent runs — first-run is ~15 min, cached
          # runs are ~30 s.
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-binary-cache-windows-2022-${{ steps.vcpkg-key.outputs.hash }}
          restore-keys: |
            vcpkg-binary-cache-windows-2022-

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          & $vcpkg install --triplet x64-windows ${{ env.VCPKG_DEPS }}

      - name: Configure
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts/buildsystems/vcpkg.cmake"

          # Point CMake at vcpkg's pkgconf explicitly rather than relying on
          # it being found by name. FindPkgConfig only learned to look for
          # "pkgconf" as well as "pkg-config" in CMake 3.22, and this project
          # declares 3.20, so naming the path keeps the two consistent
          # whatever the runner ships.
          $pkgconf = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/x64-windows/tools/pkgconf/pkgconf.exe"
          if (-not (Test-Path $pkgconf)) { throw "pkgconf not found at $pkgconf" }

          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release -DIM_BUILD_CAPTURE=ON `
            -DIM_BUILD_HEIF=ON `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DPKG_CONFIG_EXECUTABLE="$pkgconf" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build -j

      - name: Show build artefacts
        shell: pwsh
        run: |
          Get-ChildItem build/lib | Format-Table Name, Length

      # The C++ unit tests do run here. Two things self-skip rather than
      # fail:
      #   - lua.smoke is not registered at all, because vcpkg's 'lua' port
      #     installs the library but no lua.exe interpreter, and mixing in a
      #     different interpreter (e.g. from choco) does not work -- the
      #     imlua_*.dll modules are linked against vcpkg's own libluaXX.dll
      #     at the ABI level. Linux and macOS CI cover the bindings.
      #   - the attrib.isolated.* probes need fork(), so they exit 77 and
      #     CTest reports them as skipped.
      - name: Run test suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload IM libraries
        uses: actions/upload-artifact@v4
        with:
          name: im-libs-windows-2022
          path: build/lib/
          retention-days: 14
          if-no-files-found: error

      - name: Upload IM headers
        uses: actions/upload-artifact@v4
        with:
          name: im-headers-windows-2022
          path: include/
          retention-days: 14
          if-no-files-found: error

